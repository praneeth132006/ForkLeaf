<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="256" height="256" role="img" aria-label="ForkLeaf">
  <title>ForkLeaf</title>
  <!-- The ForkLeaf mark: a git fork whose branches terminate in leaves.
       Strokes use currentColor so the mark inherits its surroundings; the
       fill below sets a default for standalone use. -->
  <g fill="none" stroke="#16794c" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 21v-5.5" />
    <path d="M12 15.5c0-2.6-2-3.4-3.4-4.3M12 15.5c0-2.6 2-3.4 3.4-4.3" />
    <path d="M8.6 11.2c-1.9-1.1-2.4-3.3-1.3-5.2 1.9 1.1 2.4 3.3 1.3 5.2Z" />
    <path d="M15.4 11.2c1.9-1.1 2.4-3.3 1.3-5.2-1.9 1.1-2.4 3.3-1.3 5.2Z" />
    <circle cx="12" cy="20" r="1.6" />
  </g>
</svg>
