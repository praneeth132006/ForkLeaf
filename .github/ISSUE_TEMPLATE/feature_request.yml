name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you're in, not just the feature you want.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried or considered instead?

  - type: checkboxes
    id: scope
    attributes:
      label: Does this fit the project's goals?
      description: |
        ForkLeaf deliberately does not do real-time collaborative editing, does
        not host your notes, and does not convert exports on a server. See
        "Deliberate non-goals" in docs/architecture.md.
      options:
        - label: I've read the non-goals and this isn't one of them
