name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      # 22, not 20: GitHub is retiring the Node 20 runtime, and every action
      # pinned to it now runs on 24 with a deprecation warning regardless of
      # what this says. 22 is the current LTS and satisfies the `engines`
      # floor in package.json, so what CI runs is a version somebody could
      # actually be developing on.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # The build only needs a syntactically valid secret; no GitHub
          # credentials are configured, so CI exercises the local-only path.
          SESSION_SECRET: ci-placeholder-secret-not-used-for-anything
